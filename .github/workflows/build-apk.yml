name: Build Surgeon 3D APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Three.js, GLTFLoader and 3D Human Model
        run: |
          curl -L https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o www/three.min.js
          curl -L https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js -o www/GLTFLoader.js
          curl -L https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb -o www/head.glb
          curl -L https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/models/gltf/Soldier.glb -o www/human.glb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor and build Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Surgeon3D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
